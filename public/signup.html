<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — Smart Parking</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="logo">P</div>
    <h1>Create account</h1>
    <p class="auth-sub">free — lets you reserve slots</p>
    <form id="f" novalidate>
      <label>Username
        <input name="username" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="3–24 letters, numbers, _">
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="new-password" required minlength="6" placeholder="at least 6 characters">
      </label>
      <button type="submit">Create account</button>
      <p class="err" id="err"></p>
      <p class="auth-alt">Already registered? <a href="/login.html">Sign in</a></p>
      <p class="auth-alt"><a href="/">← back to the dashboard</a></p>
    </form>
  </div>
  <script src="/auth.js"></script>
</body>
</html>
