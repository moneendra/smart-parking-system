<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Smart Parking</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="logo">P</div>
    <h1>Sign in</h1>
    <p class="auth-sub">to reserve parking slots</p>
    <form id="f" novalidate>
      <label>Username
        <input name="username" autocomplete="username" required minlength="3" maxlength="24" placeholder="e.g. moneendra">
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required minlength="6" placeholder="at least 6 characters">
      </label>
      <button type="submit">Sign in</button>
      <p class="err" id="err"></p>
      <p class="auth-alt">No account yet? <a href="/signup.html">Sign up</a></p>
      <p class="auth-alt"><a href="/">← back to the dashboard</a></p>
    </form>
  </div>
  <script src="/auth.js"></script>
</body>
</html>
